<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AEMN STORE - Cyberpunk App Hub</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase App, Firestore & Storage -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#050508',
                            card: 'rgba(15, 17, 26, 0.85)',
                            cyan: '#00f3ff',
                            magenta: '#ff007f',
                            lime: '#00ff66',
                            purple: '#7b2cbf',
                            dark: '#08090e'
                        }
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 15px rgba(0, 243, 255, 0.4)',
                        'neon-magenta': '0 0 15px rgba(255, 0, 127, 0.4)',
                        'neon-lime': '0 0 15px rgba(0, 255, 102, 0.4)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050508;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .glass-card {
            background: rgba(15, 17, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-text-glow { text-shadow: 0 0 10px rgba(0, 243, 255, 0.6); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-24 text-slate-100 select-none">

    <!-- Header -->

                </div>
                <div>
                    <h1 id="userName" class="text-sm font-bold text-white leading-tight">زائر تليجرام</h1>
                    <p id="appTitle" class="text-xs text-cyber-cyan font-mono neon-text-glow">AEMN STORE VIP</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="openSettingsModal()" class="p-2 rounded-xl bg-cyber-dark/80 border border-cyber-cyan/40 text-cyber-cyan hover:bg-cyber-cyan/20 transition flex items-center gap-1.5 text-xs font-bold shadow-neon-cyan">

    <!-- Main Container -->

            <div class="flex gap-2">

        <!-- Categories -->

            <button onclick="setCategory('bots')" class="cat-btn glass-card text-slate-300 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap hover:text-cyber-cyan transition" data-cat="bots">🤖 البوتات</button>

        </div>

        <!-- Apps Grid -->
        <div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-3 left-4 right-4 z-40 glass-card rounded-2xl border border-cyber-cyan/30 px-6 py-2.5 flex items-center justify-around shadow-lg">
        <button onclick="switchTab('home')" class="nav-btn text-cyber-cyan flex flex-col items-center gap-1 text-[10px] font-bold">

            <i data-lucide="heart" class="w-5 h-5"></i>

    <!-- App Publishing Modal -->
    <div id="addAppModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md rounded-2xl p-5 border border-cyber-magenta shadow-neon-magenta max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-cyber-magenta flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    نشر عنصر جديد
                </h3>
                <button onclick="closeAddAppModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <!-- Publishing Type Selector Tabs -->
            <div class="flex gap-1 bg-cyber-dark p-1 rounded-xl border border-cyber-cyan/20 mb-4">
                <button type="button" onclick="switchPublishType('bot')" id="tabBot" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-cyber-cyan text-cyber-bg transition">🤖 بوت تليجرام</button>
                <button type="button" onclick="switchPublishType('apk')" id="tabApk" class="flex-1 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition">📱 تطبيق APK</button>
                <button type="button" onclick="switchPublishType('web')" id="tabWeb" class="flex-1 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition">🌐 موقع ويب</button>
            </div>

            <form id="addAppForm" onsubmit="saveNewApp(event)" class="space-y-3">
                <input type="hidden" id="publishType" value="bot">

                <!-- Bot Publishing Fields -->
                <div id="fieldsBot" class="space-y-3">
                    <div>
                        <label class="text-[11px] text-slate-300 block mb-1">اسم البوت:</label>
                        <input type="text" id="botName" placeholder="مثال: بوت التحميل الذكي" class="w-full bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-300 block mb-1">رابط أو معرف البوت:</label>
                        <input type="text" id="botUrl" placeholder="@bot_username أو https://t.me/..." class="w-full bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                </div>

                <!-- APK Publishing Fields -->
                <div id="fieldsApk" class="space-y-3 hidden">
                    <div>
                        <label class="text-[11px] text-slate-300 block mb-1">اسم تطبيق APK:</label>
                        <input type="text" id="apkName" placeholder="مثال: TopChat VIP" class="w-full bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-300 block mb-1">اختيار ملف APK من جهازك:</label>
                        <input type="file" id="apkFileSelect" accept=".apk" onchange="handleApkFileSelect(event)" class="w-full bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-3 py-1.5 text-xs text-slate-300">
                        <div id="apkFileDetails" class="mt-2 hidden p-2 bg-cyber-cyan/10 border border-cyber-cyan/30 rounded-xl text-[10px] text-cyber-cyan">
                            📁 <span id="apkFileName">اسم الملف</span> (<span id="apkFileSize">0 MB</span>)
                        </div>
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-300 block mb-1">رفع أيقونة التطبيق من الجهاز:</label>
                        <input type="file" id="apkIconFile" accept="image/*" onchange="previewApkIcon(event)" class="w-full bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-3 py-1.5 text-xs text-slate-300">
                        <div id="iconPreviewArea" class="mt-2 hidden flex items-center gap-2">
                            <img id="iconPreviewImg" class="w-8 h-8 rounded-lg object-cover border border-cyber-cyan">
                            <span class="text-[10px] text-cyber-lime">تم اختيار الصورة بنجاح</span>
                        </div>
                    </div>
                </div>

                <!-- Web Publishing Fields -->
                <div id="fieldsWeb" class="space-y-3 hidden">
                    <div>
                        <label class="text-[11px] text-slate-300 block mb-1">اسم الموقع:</label>
                        <input type="text" id="webName" placeholder="مثال: موقع الخدمات السريعة" class="w-full bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-300 block mb-1">رابط الموقع (URL):</label>
                        <input type="url" id="webUrl" placeholder="https://example.com" class="w-full bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                </div>

                <!-- Common Description Field -->
                <div>
                    <label class="text-[11px] text-slate-300 block mb-1">الوصف ووظائف العناصر:</label>
                    <textarea id="newAppDesc" rows="2" placeholder="اكتب وصفاً موجزاً..." class="w-full bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-3 py-2 text-xs text-white"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-cyber-magenta text-white py-2.5 rounded-xl text-xs font-bold shadow-neon-magenta mt-2">نشر المورد فوراً</button>
            </form>
        </div>
    </div>

    <!-- General Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-2xl p-5 border border-cyber-cyan shadow-neon-cyan space-y-4">
            <div class="flex justify-between items-center border-b border-cyber-cyan/20 pb-3">
                <h3 class="text-sm font-bold text-cyber-cyan flex items-center gap-2">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    الإعدادات والروابط
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="space-y-2.5">
                <button onclick="window.open('https://t.me/aemnalsdran', '_blank')" class="w-full bg-cyber-dark/90 hover:bg-cyber-cyan/20 border border-cyber-cyan/40 text-white p-3 rounded-xl text-xs font-bold flex items-center justify-between transition shadow-neon-cyan">
                    <div class="flex items-center gap-2">
                        <i data-lucide="headphones" class="w-4 h-4 text-cyber-cyan"></i>
                        <span>خدمة العملاء</span>
                    </div>
                    <span class="text-[10px] font-mono text-cyber-cyan">@aemnalsdran</span>
                </button>

                <button onclick="window.open('https://t.me/gnahma', '_blank')" class="w-full bg-cyber-dark/90 hover:bg-cyber-magenta/20 border border-cyber-magenta/40 text-white p-3 rounded-xl text-xs font-bold flex items-center justify-between transition shadow-neon-magenta">
                    <div class="flex items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4 text-cyber-magenta"></i>
                        <span>قناة البوت للاشتراك</span>
                    </div>
                    <span class="text-[10px] font-mono text-cyber-magenta">@gnahma</span>
                </button>
            </div>

            <div class="pt-2 border-t border-cyber-cyan/20">
                <label class="text-[10px] text-slate-400 block mb-1">توكن البوت (اختياري للنشر التلقائي):</label>
                <div class="flex gap-2">
                    <input type="text" id="botTokenInput" placeholder="123456789:ABC..." class="flex-1 bg-cyber-dark border border-cyber-cyan/30 rounded-xl px-2.5 py-1.5 text-[11px] font-mono text-white">
                    <button onclick="saveBotToken()" class="bg-cyber-cyan text-cyber-bg px-3 py-1.5 rounded-xl text-[10px] font-bold">حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 glass-card px-4 py-2.5 rounded-xl border border-cyber-cyan text-cyber-cyan text-xs font-bold shadow-neon-cyan transition-all transform -translate-y-20 opacity-0 pointer-events-none flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4"></i>
        <span id="toastMsg">إشعار</span>
    </div>

    <!-- Script Implementation -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBIQdZRL0cXqarBpoDoU5yWzoQ-LM341Bg",
            authDomain: "aemnstore-c0954.firebaseapp.com",
            projectId: "aemnstore-c0954",
            storageBucket: "aemnstore-c0954.firebasestorage.app",
            messagingSenderId: "141174858785",
            appId: "1:141174858785:web:05ef9c5f6d879f0a9a6f60",
            measurementId: "G-NQKHPZY42D"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentCategory = 'all';
        let botToken = localStorage.getItem('tg_bot_token') || '';
        let uploadedApkIconBase64 = '';
        let selectedApkFile = null;
        let appsData = [];

        db.collection("apps").onSnapshot((snapshot) => {
            if (!snapshot.empty) {
                appsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } else {
                appsData = [];
            }
            renderApps();
        });

        function handleApkFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedApkFile = file;
                const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
                document.getElementById('apkFileName').innerText = file.name;
                document.getElementById('apkFileSize').innerText = fileSizeMB + ' MB';
                document.getElementById('apkFileDetails').classList.remove('hidden');

                if (!document.getElementById('apkName').value) {
                    document.getElementById('apkName').value = file.name.replace('.apk', '');
                }
            }
        }

        function switchPublishType(type) {
            document.getElementById('publishType').value = type;
            const btnBot = document.getElementById('tabBot');
            const btnApk = document.getElementById('tabApk');
            const btnWeb = document.getElementById('tabWeb');

            const fieldsBot = document.getElementById('fieldsBot');
            const fieldsApk = document.getElementById('fieldsApk');
            const fieldsWeb = document.getElementById('fieldsWeb');

            [btnBot, btnApk, btnWeb].forEach(b => b.className = "flex-1 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition");
            [fieldsBot, fieldsApk, fieldsWeb].forEach(f => f.classList.add('hidden'));

            if (type === 'bot') {
                btnBot.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-cyber-cyan text-cyber-bg transition";
                fieldsBot.classList.remove('hidden');
            } else if (type === 'apk') {
                btnApk.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-cyber-magenta text-white transition";
                fieldsApk.classList.remove('hidden');
            } else {
                btnWeb.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-cyber-lime text-cyber-bg transition";
                fieldsWeb.classList.remove('hidden');
            }
        }

        function previewApkIcon(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedApkIconBase64 = e.target.result;
                    document.getElementById('iconPreviewImg').src = uploadedApkIconBase64;
                    document.getElementById('iconPreviewArea').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        async function saveNewApp(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            const type = document.getElementById('publishType').value;
            let desc = document.getElementById('newAppDesc').value.trim();

            let newApp = {
                desc: desc || 'لا يوجد وصف متاح.',
                rating: 5.0,
                downloads: 1,
                safe: true,
                createdAt: new Date().toISOString()
            };

            try {
                if (type === 'bot') {
                    newApp.name = document.getElementById('botName').value.trim();
                    newApp.url = document.getElementById('botUrl').value.trim();
                    newApp.category = 'bots';
                    newApp.icon = 'https://telegram.org/img/t_logo.png';
                } else if (type === 'apk') {
                    newApp.name = document.getElementById('apkName').value.trim();
                    newApp.category = 'mods';
                    newApp.icon = uploadedApkIconBase64 || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100';

                    if (!selectedApkFile) {
                        showToast('يرجى تحديد ملف APK من جهازك أولاً');
                        submitBtn.disabled = false;
                        return;
                    }

                    submitBtn.innerText = 'جاري رفع ملف APK للسحابة...';
                    
                    // رفع ملف الـ APK إلى Firebase Storage
                    const apkRef = storage.ref(`apks/${Date.now()}_${selectedApkFile.name}`);
                    const uploadTask = await apkRef.put(selectedApkFile);
                    const downloadUrl = await uploadTask.ref.getDownloadURL();

                    newApp.url = downloadUrl;
                    const fileSizeMB = (selectedApkFile.size / (1024 * 1024)).toFixed(2);
                    newApp.desc += ` (حجم الملف: ${fileSizeMB} MB)`;
                } else {
                    newApp.name = document.getElementById('webName').value.trim();
                    newApp.url = document.getElementById('webUrl').value.trim();
                    newApp.category = 'web';
                    newApp.icon = 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=100';
                }

                if (!newApp.name) {
                    showToast('يرجى إدخال اسم التطبيق/البوت');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'نشر المورد فوراً';
                    return;
                }

                submitBtn.innerText = 'جاري الحفظ...';
                await db.collection("apps").add(newApp);

                showToast('تم رفع ونشر التطبيق بنجاح!');
                postToChannel(newApp);
                closeAddAppModal();
            } catch (err) {
                console.error("Publish Error: ", err);
                showToast('حدث خطأ أثناء الرفع، تأكد من تفعيل Storage Rules');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'نشر المورد فوراً';
            }
        }

        function postToChannel(app) {
            if (!botToken) return;
            const channelId = "@aemnalsdran5";
            const text = `🚀 *تم نشر جديد في متجر AEMN STORE*\n\n📌 *الاسم:* ${app.name}\n📝 *الوصف:* ${app.desc}\n🔗 *الرابط:* ${app.url}`;
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: channelId, text: text, parse_mode: 'Markdown' })
            }).catch(e => console.error(e));
        }

        function renderApps() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';

            const filtered = appsData.filter(app => {
                const matchCat = currentCategory === 'all' || app.category === currentCategory;
                const matchSearch = (app.name && app.name.toLowerCase().includes(search)) || (app.desc && app.desc.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            document.getElementById('appCount').innerText = `${filtered.length} عنصر`;

            filtered.forEach(app => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-3 border border-cyber-cyan/20 flex gap-3 items-center hover:border-cyber-cyan/50 transition';
                card.innerHTML = `
                    <img src="${app.icon}" class="w-14 h-14 rounded-xl object-cover border border-cyber-cyan/30">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <h4 class="text-xs font-bold text-white truncate">${app.name}</h4>
                            <span class="text-[9px] bg-cyber-lime/10 text-cyber-lime px-1.5 py-0.5 rounded border border-cyber-lime/30">آمن</span>
                        </div>
                        <p class="text-[11px] text-slate-400 line-clamp-1 mb-1.5">${app.desc}</p>
                        <div class="flex items-center gap-3 text-[10px] text-slate-300 font-mono">
                            <span class="text-yellow-400">★ ${app.rating || 5.0}</span>
                            <span>📥 ${app.downloads || 1}</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <button onclick="handleAppOpen('${app.id}')" class="bg-cyber-cyan/20 hover:bg-cyber-cyan text-cyber-cyan hover:text-cyber-bg border border-cyber-cyan/40 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-neon-cyan">
                            <span>تحميل/فتح</span>
                            <i data-lucide="external-link" class="w-3 h-3"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function handleAppOpen(appId) {
            const app = appsData.find(a => a.id === appId);
            if (!app || !app.url) return;
            window.open(app.url, '_blank');
        }

        function openAddAppModal() {
            document.getElementById('addAppModal').classList.remove('hidden');
        }

        function closeAddAppModal() {
            document.getElementById('addAppModal').classList.add('hidden');
        }

        function openSettingsModal() {
            document.getElementById('botTokenInput').value = botToken;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveBotToken() {
            botToken = document.getElementById('botTokenInput').value.trim();
            localStorage.setItem('tg_bot_token', botToken);
            showToast('تم حفظ توكن البوت بنجاح');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderApps();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderApps();
        });
    </script>
</body>
</html>
